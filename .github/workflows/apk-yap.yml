name: Grupaj Final APK
on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Telefon Ici Motoru Hazirla ve APK Derle
        run: |
          mkdir -p nodejs-project
          cp mobil-motor.js nodejs-project/main.js
          cp package.json nodejs-project/package.json
          cp -r www nodejs-project/www
          npm install
          cd nodejs-project && npm install --omit=dev && cd ..
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Final APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Grupaj-Tam-Bagimsiz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
